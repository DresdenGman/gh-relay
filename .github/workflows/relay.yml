name: relay

on:
  workflow_dispatch:
  schedule:
    - cron: '5 */5 * * *'

permissions:
  contents: read
  issues: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Download sing-box and cloudflared
        run: |
          curl -sL -o sb.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.10.0/sing-box-1.10.0-linux-amd64.tar.gz
          tar xzf sb.tar.gz
          cp sing-box-1.10.0-linux-amd64/sing-box ./sing-box
          chmod +x ./sing-box
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x ./cloudflared

      - name: Write config
        env:
          R_UUID: ${{ secrets.RELAY_UUID }}
          R_PATH: ${{ secrets.RELAY_PATH }}
          IDX: 1
        run: |
          cat > sb.json <<EOF
          {
            "log": {"level": "warn"},
            "inbounds": [
              {
                "type": "vless",
                "listen": "127.0.0.1",
                "listen_port": 8080,
                "users": [{"uuid": "${R_UUID}"}],
                "transport": {"type": "ws", "path": "${R_PATH}"}
              }
            ],
            "outbounds": [{"type": "direct"}]
          }
          EOF

      - name: Start relay and publish endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R_PATH: ${{ secrets.RELAY_PATH }}
          IDX: 1
        run: |
          ./sing-box run -c sb.json &
          sleep 4
          ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cf.log 2>&1 &
          D=""
          for i in $(seq 1 30); do
            D=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            if [ -n "$D" ]; then break; fi
            sleep 5
          done
          echo "TUNNEL=$D idx=${IDX}"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MSG="TUNNEL_URL=$D"$'\n'"PATH=${R_PATH}${IDX}"$'\n'"IDX=${IDX}"
          gh api "repos/${{ github.repository }}/issues" \
            -f title="relay-endpoint-1 ${TS}" \
            -f body="$MSG" > /dev/null 2>&1 || true
          sleep 20400
